<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo do Valorant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./tmi.min.js"></script>
    <style>
        /*
 * Preview de layout para o Bingo do Valorant.
 * Ainda não integrado ao HTML nem enviado ao GitHub.
 * Para testar, cole este bloco no final do <style> de valorant/index.html.
 */

/* Base visual */
html {
    min-height: 100%;
    background: #0b1020;
}

body.bg-gray-100 {
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    margin: 0;
    color: #e5eaf5;
    background:
        radial-gradient(ellipse at top left, rgba(81, 97, 180, .22), transparent 42%),
        #0b1020;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* Cabeçalho com quebra responsiva */
body > .bg-blue-600 {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    min-height: 88px;
    padding: 14px 24px;
    color: #f8fafc;
    background: linear-gradient(110deg, #111827 0%, #172554 55%, #1e1b4b 100%);
    border-bottom: 1px solid rgba(148, 163, 184, .2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .24);
    font-size: 1rem;
}

body > .bg-blue-600 > .flex:first-child {
    flex-wrap: wrap;
    gap: 10px 12px;
}

body > .bg-blue-600 label {
    font-size: .9rem;
    font-weight: 600;
    color: #dbeafe;
}

body > .bg-blue-600 input[type="text"] {
    min-width: 190px;
    min-height: 42px;
    padding: 9px 12px;
    border: 1px solid rgba(148, 163, 184, .38);
    border-radius: 11px;
    background: rgba(15, 23, 42, .82);
    color: #f8fafc;
    font-size: .9rem;
    outline: none;
    transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
}

body > .bg-blue-600 input[type="text"]:focus {
    border-color: #a5b4fc;
    background: #0f172a;
    box-shadow: 0 0 0 3px rgba(129, 140, 248, .2);
}

body > .bg-blue-600 > .mx-auto {
    margin-left: auto;
    margin-right: auto;
    font-size: clamp(1.25rem, 2.2vw, 1.9rem);
    font-weight: 800;
    letter-spacing: -.04em;
    white-space: nowrap;
}

.button,
.set-channel {
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    box-shadow: 0 5px 16px rgba(99, 102, 241, .22);
    transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
}

.button:hover,
.set-channel:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(99, 102, 241, .3);
}

.button:disabled,
.set-channel:disabled {
    opacity: .65;
    cursor: not-allowed;
    transform: none;
}

#set-channel {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-width: 132px;
    min-height: 42px;
    padding: 9px 15px;
    border: 1px solid rgba(165, 180, 252, .48);
    border-radius: 11px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    box-shadow: 0 5px 16px rgba(79, 70, 229, .28);
    color: #fff;
    font-size: .9rem;
    font-weight: 700;
    letter-spacing: .01em;
    white-space: nowrap;
}

#set-channel::before {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c7d2fe;
    box-shadow: 0 0 0 3px rgba(199, 210, 254, .15);
    content: "";
}

#set-channel.is-connecting {
    background: #334155;
    border-color: rgba(148, 163, 184, .35);
    box-shadow: none;
}

#set-channel.is-connecting::before {
    background: #fbbf24;
    box-shadow: 0 0 0 3px rgba(251, 191, 36, .15);
}

#set-channel.is-connected {
    background: linear-gradient(135deg, #047857, #059669);
    border-color: rgba(110, 231, 183, .45);
    box-shadow: 0 5px 16px rgba(5, 150, 105, .22);
}

#set-channel.is-connected::before {
    background: #a7f3d0;
    box-shadow: 0 0 0 3px rgba(167, 243, 208, .16);
}

#set-channel.is-error {
    background: linear-gradient(135deg, #be123c, #e11d48);
    border-color: rgba(253, 164, 175, .45);
}

#set-channel.is-error::before {
    background: #fecdd3;
    box-shadow: 0 0 0 3px rgba(254, 205, 211, .16);
}

#set-channel:disabled {
    opacity: 1;
    cursor: default;
}

#set-channel:disabled:hover {
    transform: none;
    filter: none;
}

body > .bg-blue-600 > .flex:nth-child(2) {
    gap: 9px;
    margin-left: 0;
    padding: 9px 12px;
    border: 1px solid rgba(148, 163, 184, .2);
    border-radius: 11px;
    background: rgba(15, 23, 42, .45);
}

body > .bg-blue-600 input[type="checkbox"] {
    accent-color: #818cf8;
}

/* Área principal: jogadores, sorteio, ranking e eventos */
body > .flex.flex-grow {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(280px, .9fr) minmax(240px, .7fr);
    grid-template-rows: minmax(0, 1fr);
    align-items: stretch;
    gap: 18px;
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    padding: 20px;
}

body > .flex.flex-grow > .w-3\/5,
body > .flex.flex-grow > .w-1\/5,
body > .flex.flex-grow > .main-container,
body > .flex.flex-grow > .event-panel {
    width: auto;
    min-width: 0;
    height: auto;
    min-height: 0;
    border: 1px solid rgba(148, 163, 184, .18);
    border-radius: 16px;
    background: rgba(17, 24, 39, .82);
    box-shadow: 0 12px 28px rgba(0, 0, 0, .16);
}

body > .flex.flex-grow > .w-3\/5,
body > .flex.flex-grow > .w-1\/5,
body > .flex.flex-grow > .event-panel {
    padding: 18px;
}

body > .flex.flex-grow > .w-3\/5 > p,
body > .flex.flex-grow > .w-1\/5 > p,
body > .flex.flex-grow > .event-panel > p,
#ranking-container > p {
    margin-bottom: 16px;
    color: #f1f5f9;
    font-size: 1rem;
    letter-spacing: -.01em;
}

body > .flex.flex-grow > .w-3\/5 {
    overflow-x: auto;
    overflow-y: auto;
}

#player-list {
    margin: 0;
    padding: 0;
}

.join-prompt[hidden] { display: none; }
.join-prompt {
    margin: 0 0 22px;
    padding: 28px 24px;
    border: 2px solid rgba(129, 140, 248, .56);
    border-radius: 20px;
    background: linear-gradient(120deg, rgba(79, 70, 229, .2), rgba(14, 165, 233, .12));
    box-shadow: 0 12px 30px rgba(0, 0, 0, .24), 0 0 24px rgba(99, 102, 241, .12), inset 0 1px rgba(255, 255, 255, .08);
    text-align: center;
}
.join-prompt-title {
    display: block;
    margin-bottom: 10px;
    color: #f8fafc;
    font-size: 1.35rem;
    font-weight: 800;
}
.join-prompt p { margin: 0; color: #dbeafe; font-size: 1.02rem; line-height: 1.5; }
.join-prompt code {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 20px;
    border: 1px solid rgba(165, 180, 252, .4);
    border-radius: 12px;
    color: #e0e7ff;
    background: rgba(15, 23, 42, .72);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: .03em;
}

#player-list > li {
    gap: 12px;
    padding: 14px;
    border: 1px solid rgba(148, 163, 184, .14);
    border-radius: 12px;
    background: rgba(30, 41, 59, .66);
}

#player-list > li > span {
    min-width: 90px;
    color: #e2e8f0;
    overflow-wrap: anywhere;
}

.item-image {
    width: clamp(66px, 7.5vw, 110px);
    height: clamp(66px, 7.5vw, 110px);
    object-fit: contain;
    border-radius: 8px;
}

#player-list .item-image {
    background: rgba(15, 23, 42, .7);
}

.item-image.highlight-background {
    border: 3px solid #34d399;
    background-color: rgba(16, 185, 129, .12);
}

/* Ranking e sorteio */
body > .flex.flex-grow > .main-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 14px;
}

#ranking-container {
    flex: 0 0 auto;
    height: auto;
    max-height: 32vh;
    margin: 0;
    padding: 14px;
    overflow-y: auto;
    border: 1px solid rgba(148, 163, 184, .18);
    border-radius: 12px;
    background: rgba(15, 23, 42, .78);
    color: #e2e8f0;
    text-align: left;
}

.ranking-item {
    padding: 9px 4px;
    border-bottom: 1px solid rgba(148, 163, 184, .14);
    color: #cbd5e1;
    font-size: .9rem;
}

#sortear-btn {
    flex: 0 0 auto;
    width: 100%;
    height: auto;
    min-height: 58px;
    margin: 0;
    padding: 15px;
    font-size: .9rem;
    letter-spacing: .04em;
}

.winner-wait {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid rgba(251, 191, 36, .35);
    border-radius: 12px;
    background: rgba(120, 53, 15, .2);
    color: #fde68a;
    font-size: .9rem;
}

.winner-wait[hidden] {
    display: none;
}

.winner-wait-time {
    flex: 0 0 auto;
    color: #f8fafc;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
}

.winner-presence-alert {
    padding: 12px 14px;
    border: 1px solid rgba(52, 211, 153, .35);
    border-radius: 12px;
    background: rgba(6, 78, 59, .35);
    color: #a7f3d0;
    font-size: .9rem;
}

.winner-presence-alert[hidden],
.remove-winner-btn[hidden] {
    display: none;
}

.remove-winner-btn {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
}

#log-central {
    flex: 1 1 0;
    height: 0;
    min-height: 0;
    margin: 0;
    padding: 12px;
    overflow-y: auto;
    border: 1px solid rgba(148, 163, 184, .18);
    border-radius: 12px;
    background: rgba(15, 23, 42, .78);
    color: #e2e8f0;
}

.log-item {
    margin-bottom: 10px;
    padding: 12px;
    overflow-wrap: anywhere;
    border: 1px solid rgba(148, 163, 184, .14);
    border-radius: 10px;
    background: #1e293b;
    color: #e2e8f0;
}

.log-item .item-image {
    display: block;
    margin: 8px auto;
    background: rgba(15, 23, 42, .7);
}

.event-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
}

#event-log {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    list-style: none;
}

.event-log-item {
    padding: 10px 12px;
    overflow-wrap: anywhere;
    border: 1px solid rgba(148, 163, 184, .14);
    border-left: 3px solid #818cf8;
    border-radius: 10px;
    background: rgba(30, 41, 59, .78);
    color: #cbd5e1;
    font-size: .85rem;
    line-height: 1.45;
}

.event-log-item[data-type="player"] {
    border-left-color: #38bdf8;
}

.event-log-item[data-type="score"] {
    border-left-color: #34d399;
}

.event-log-item[data-type="winner"] {
    border-left-color: #fbbf24;
}

.event-log-item[data-type="presence"] {
    border-left-color: #c084fc;
}

.event-log-item[data-type="error"] {
    border-left-color: #fb7185;
}

.event-log-time {
    display: block;
    margin-bottom: 3px;
    color: #94a3b8;
    font-size: .75rem;
}

/* Ajuda */
.help-btn {
    position: fixed;
    top: 20px;
    right: 22px;
    z-index: 20;
    display: grid;
    width: 46px;
    height: 46px;
    place-items: center;
    border: 2px solid rgba(224, 231, 255, .8);
    border-radius: 50%;
    background: linear-gradient(145deg, #818cf8, #4f46e5);
    color: #f8fafc;
    box-shadow: 0 6px 20px rgba(79, 70, 229, .48), 0 0 0 4px rgba(129, 140, 248, .13);
    font-size: 1.3rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.help-btn:hover {
    transform: translateY(-2px) scale(1.06);
    background: linear-gradient(145deg, #a5b4fc, #6366f1);
    box-shadow: 0 9px 26px rgba(79, 70, 229, .58), 0 0 0 5px rgba(129, 140, 248, .18);
}
.help-btn:focus-visible {
    outline: 3px solid #c7d2fe;
    outline-offset: 4px;
}

.help-modal[hidden] { display: none; }
.help-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(3, 7, 18, .78);
    backdrop-filter: blur(8px);
}
.help-dialog {
    display: flex;
    flex-direction: column;
    width: min(900px, 100%);
    height: min(760px, 90vh);
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, .24);
    border-radius: 20px;
    background: #0f172a;
    box-shadow: 0 28px 80px rgba(0, 0, 0, .55);
}
.help-dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    color: #f8fafc;
    border-bottom: 1px solid rgba(148, 163, 184, .18);
}
.help-dialog-header h2 { margin: 0; font-size: 1rem; }
.help-close {
    width: 36px;
    height: 36px;
    border: 1px solid rgba(148, 163, 184, .25);
    border-radius: 10px;
    color: #e2e8f0;
    background: rgba(255, 255, 255, .06);
    cursor: pointer;
    font-size: 1.35rem;
}
.help-close:hover { background: rgba(255, 255, 255, .14); }
.help-frame { flex: 1; width: 100%; min-height: 0; border: 0; background: #0b1020; }

/* Tablets */
@media (max-width: 1100px) {
    body > .flex.flex-grow {
        grid-template-columns: minmax(0, 1.3fr) minmax(260px, .9fr);
        grid-template-rows: minmax(0, 1fr) minmax(0, 320px);
    }

    body > .flex.flex-grow > .event-panel {
        grid-column: 1 / -1;
        max-height: 320px;
    }

    body > .bg-blue-600 > .mx-auto {
        margin-left: 0;
    }
}

/* Celulares */
@media (max-width: 700px) {
    body.bg-gray-100 {
        height: auto;
        min-height: 100vh;
        overflow: auto;
    }

    body > .bg-blue-600 {
        padding: 16px;
        gap: 12px;
    }

    body > .bg-blue-600 > .flex:first-child {
        width: 100%;
    }

    body > .bg-blue-600 input[type="text"] {
        flex: 1 1 160px;
        min-width: 0;
    }

    body > .bg-blue-600 > .mx-auto {
        width: 100%;
        margin: 0;
        white-space: normal;
    }

    body > .flex.flex-grow {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto;
        flex: 0 0 auto;
        min-height: calc(100vh - 88px);
        overflow: visible;
        gap: 12px;
        padding: 12px;
    }

    body > .flex.flex-grow > .w-3\/5,
    body > .flex.flex-grow > .w-1\/5,
    body > .flex.flex-grow > .main-container,
    body > .flex.flex-grow > .event-panel {
        grid-column: auto;
        max-height: none;
    }

    body > .flex.flex-grow > .w-3\/5 {
        order: 1;
        max-height: min(60vh, 600px);
        overflow-y: auto;
    }

    body > .flex.flex-grow > .main-container {
        order: 2;
    }

    body > .flex.flex-grow > .event-panel {
        order: 3;
        max-height: 300px;
    }

    #player-list > li {
        align-items: flex-start;
        flex-direction: column;
    }

    #player-list > li > div {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .item-image {
        width: 72px;
        height: 72px;
    }

    #log-central {
        flex: 0 1 auto;
        height: min(45vh, 420px);
        min-height: 240px;
        max-height: 420px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}

    </style>
</head>

<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Banner no topo da página -->
    <div class="bg-blue-600 text-white flex items-center py-4 px-6 text-2xl font-bold relative">
        <!-- Campo para inserir o canal da Twitch -->
        <div class="flex items-center space-x-4">
            <label for="twitch-channel" class="text-white text-lg">Canal da Twitch:</label>
            <input id="twitch-channel" type="text" class="px-2 py-1 rounded text-black" placeholder="Digite o canal" />
            <button id="set-channel" class="button set-channel" type="button">Conectar</button>
        </div>
        <div class="flex items-center space-x-1 ml-4">
            <input type="checkbox" id="toggle-feature" class="h-5 w-5" />
            <label for="toggle-feature" class="text-white text-lg">Somente subs?</label>
        </div>
        <!-- Centralização do título -->
        <div class="mx-auto">Bingo do Valorant</div>
    </div>

    <button id="help-btn" class="help-btn" type="button" aria-label="Abrir ajuda" title="Ajuda">?</button>

    <div id="help-modal" class="help-modal" hidden>
        <section class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-dialog-title">
            <div class="help-dialog-header">
                <h2 id="help-dialog-title">Ajuda do Bingo do Valorant</h2>
                <button id="help-close" class="help-close" type="button" aria-label="Fechar ajuda">&times;</button>
            </div>
            <iframe class="help-frame" src="ajuda.html" title="Ajuda do Bingo do Valorant"></iframe>
        </section>
    </div>

    <div class="flex flex-grow">
        <!-- Lista lateral esquerda -->
        <div class="w-3/5 bg-white border-r border-gray-300 overflow-y-auto p-4">
            <p class="font-bold text-lg mb-4">Lista de Jogadores:</p>
            <div id="join-prompt" class="join-prompt" role="status" aria-live="polite" hidden>
                <span class="join-prompt-title">Participe do Bingo!</span>
                <p>Para entrar no sorteio, envie este comando no chat da Twitch:</p>
                <code>!participar</code>
            </div>
            <ul id="player-list" class="space-y-4">
                <!-- Lista de nomes e imagens será gerada dinamicamente aqui -->
            </ul>
        </div>

        <!-- Centro da tela com o botão e o log -->
        <div class="main-container w-1/5">
            <!-- Ranking no topo ocupando 30% da tela -->
            <div id="ranking-container" class="ranking-container h-[30vh]">
                <p class="font-bold text-lg mb-4">Ranking dos Jogadores:</p>
            </div>

            <!-- Botão de sortear ocupando 10% da tela -->
            <button id="sortear-btn" class="button fixed-button h-[10vh]">Sortear novo item</button>

            <div id="winner-wait" class="winner-wait" role="status" aria-live="polite" hidden>
                <span id="winner-wait-label"></span>
                <time id="winner-wait-time" class="winner-wait-time">00:00</time>
            </div>
            <div id="winner-presence-alert" class="winner-presence-alert" role="status" aria-live="polite" hidden></div>
            <button id="continue-draw-btn" class="button remove-winner-btn" type="button" hidden>
                Continuar sorteio para outro vencedor
            </button>
            <button id="remove-winner-btn" class="button remove-winner-btn" type="button" hidden>
                Remover jogador e continuar sorteio
            </button>

            <!-- Log central ocupando 60% da tela -->
            <div id="log-central" class="log-container h-[60vh] mt-6">
                <!-- Logs dos itens sorteados serão adicionados aqui -->
            </div>
        </div>

        <aside class="event-panel">
            <p class="font-bold text-lg mb-4">Eventos do jogo:</p>
            <ol id="event-log" aria-live="polite" aria-relevant="additions"></ol>
        </aside>

    </div>

    <script>
        let playerList = document.getElementById('player-list');
        let skinList = [];
        let itensSorteaveis = [];
        let itensSorteados = [];
        let winnerList = [];
        let presenceConfirmed = new Set();
        let itemsForEachPlayer = 6;
        let twitchChannel = "omiuner";
        let twitchConnected = false;
        let somenteSubs = false;
        let skinsLoaded = null;
        let winnerWaitStartedAt = null;
        let winnerWaitTimer = null;
        let winnerWaitTimeout = null;
        let awaitedWinnerNames = [];

        function addEventLog(message, type = 'game') {
            const eventLog = document.getElementById('event-log');
            const entry = document.createElement('li');
            const time = document.createElement('time');
            const text = document.createElement('span');

            entry.className = 'event-log-item';
            entry.dataset.type = type;
            time.className = 'event-log-time';
            time.dateTime = new Date().toISOString();
            time.textContent = new Date().toLocaleTimeString('pt-BR');
            text.textContent = message;
            entry.append(time, text);
            eventLog.prepend(entry);

            if (eventLog.children.length > 100) {
                eventLog.removeChild(eventLog.lastElementChild);
            }
        }

        function updateJoinPrompt() {
            document.getElementById('join-prompt').hidden = !twitchConnected || itensSorteados.length > 0;
        }

        function formatElapsedTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const pad = value => String(value).padStart(2, '0');
            return hours > 0
                ? `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`
                : `${pad(minutes)}:${pad(seconds)}`;
        }

        function updateWinnerWaitTime() {
            const elapsedSeconds = Math.floor((Date.now() - winnerWaitStartedAt) / 1000);
            document.getElementById('winner-wait-time').textContent = formatElapsedTime(elapsedSeconds);
        }

        function startWinnerWait(winners) {
            if (winnerWaitStartedAt !== null) return;

            awaitedWinnerNames = winners.filter(name => !presenceConfirmed.has(name.toLowerCase()));
            if (!awaitedWinnerNames.length) return;
            winnerWaitStartedAt = Date.now();
            document.getElementById('winner-presence-alert').hidden = true;
            document.getElementById('continue-draw-btn').hidden = true;
            document.getElementById('remove-winner-btn').hidden = true;
            document.getElementById('winner-wait-label').textContent =
                `Aguardando mensagem de ${awaitedWinnerNames.join(' ou ')}.`;
            document.getElementById('winner-wait').hidden = false;
            document.getElementById('sortear-btn').disabled = true;
            updateWinnerWaitTime();
            winnerWaitTimer = setInterval(updateWinnerWaitTime, 1000);
            winnerWaitTimeout = setTimeout(() => {
                updateWinnerWaitTime();
                winnerWaitTimeout = null;
                const removeButton = document.getElementById('remove-winner-btn');
                removeButton.textContent = awaitedWinnerNames.length > 1
                    ? 'Remover jogadores e continuar sorteio'
                    : 'Remover jogador e continuar sorteio';
                removeButton.hidden = false;
            }, 10000);
        }

        function confirmWinnerPresence(winner) {
            const awaited = awaitedWinnerNames.some(name => name.toLowerCase() === winner.toLowerCase());
            if (!awaited) return;

            if (winnerWaitTimer !== null) {
                updateWinnerWaitTime();
                clearInterval(winnerWaitTimer);
                winnerWaitTimer = null;
            }
            if (winnerWaitTimeout !== null) {
                clearTimeout(winnerWaitTimeout);
                winnerWaitTimeout = null;
            }
            document.getElementById('winner-wait').hidden = true;
            document.getElementById('remove-winner-btn').hidden = true;
            const alert = document.getElementById('winner-presence-alert');
            alert.textContent = `Presença confirmada por ${winner}.`;
            alert.hidden = false;
            document.getElementById('continue-draw-btn').hidden = false;
        }

        function continueDrawForMoreWinners() {
            if (winnerWaitTimer !== null) clearInterval(winnerWaitTimer);
            if (winnerWaitTimeout !== null) clearTimeout(winnerWaitTimeout);
            winnerWaitTimer = null;
            winnerWaitTimeout = null;
            winnerWaitStartedAt = null;
            awaitedWinnerNames = [];
            document.getElementById('winner-wait').hidden = true;
            document.getElementById('winner-presence-alert').hidden = true;
            document.getElementById('continue-draw-btn').hidden = true;
            document.getElementById('sortear-btn').disabled = false;
            addEventLog('Sorteio retomado para buscar outro vencedor.', 'game');
        }

        function removeAwaitingWinnersAndContinue() {
            const removedNames = new Set(awaitedWinnerNames.map(name => name.toLowerCase()));
            players = players.filter(player => !removedNames.has(player.username.toLowerCase()));
            updateJoinPrompt();
            winnerList = winnerList.filter(name => !removedNames.has(name.toLowerCase()));
            removedNames.forEach(name => presenceConfirmed.delete(name));

            Array.from(playerList.children).forEach(item => {
                if (removedNames.has((item.dataset.username || '').toLowerCase())) item.remove();
            });

            if (winnerWaitTimer !== null) clearInterval(winnerWaitTimer);
            if (winnerWaitTimeout !== null) clearTimeout(winnerWaitTimeout);
            winnerWaitTimer = null;
            winnerWaitTimeout = null;
            winnerWaitStartedAt = null;
            awaitedWinnerNames = [];
            document.getElementById('winner-wait').hidden = true;
            document.getElementById('winner-presence-alert').hidden = true;
            document.getElementById('continue-draw-btn').hidden = true;
            document.getElementById('remove-winner-btn').hidden = true;
            document.getElementById('winner-wait-time').textContent = '00:00';
            document.getElementById('sortear-btn').disabled = false;
            updateRanking();
            addEventLog(`Jogador${removedNames.size > 1 ? 'es' : ''} sem presença removido${removedNames.size > 1 ? 's' : ''}; sorteio retomado.`, 'error');
        }

        function initializeTMI() {
            twitchConnected = false;
            updateJoinPrompt();
            const client = new tmi.Client({
                channels: [twitchChannel] // O canal da Twitch será monitorado aqui
            });

            client.on('disconnected', reason => {
                twitchConnected = false;
                updateJoinPrompt();
                const connectButton = document.getElementById('set-channel');
                connectButton.classList.remove('is-connected', 'is-connecting');
                connectButton.classList.add('is-error');
                connectButton.textContent = 'Conectar novamente';
                document.getElementById('twitch-channel').disabled = false;
                connectButton.disabled = false;
                addEventLog(`Conexão com a Twitch encerrada: ${reason || 'sem detalhes'}.`, 'error');
            });

            client.on('message', (channel, tags, message, self) => {
                if (self) return;

                const username = (tags.username || '').toLowerCase();
                const winner = winnerList.find(name => name.toLowerCase() === username);
                if (winner) {
                    if (!presenceConfirmed.has(username)) {
                        presenceConfirmed.add(username);
                        confirmWinnerPresence(winner);
                        addEventLog(`${winner} confirmou presença no chat após vencer.`, 'presence');
                    }
                }

                if (!message.toLowerCase().startsWith('!participar') || itensSorteados.length > 0) return;
                if (somenteSubs && !tags.subscriber) {
                    addEventLog(`${tags.username} tentou participar, mas o bingo está restrito a subs.`, 'error');
                    return;
                }

                skinsLoaded.then(() => tryToAddPlayer(tags));
            });

            addEventLog(`Conectando ao canal ${twitchChannel}...`);
            const connectButton = document.getElementById('set-channel');
            connectButton.classList.remove('is-connected', 'is-error');
            connectButton.classList.add('is-connecting');
            connectButton.textContent = 'Conectando';
            client.connect()
                .then(() => {
                    twitchConnected = true;
                    updateJoinPrompt();
                    connectButton.classList.remove('is-connecting', 'is-error');
                    connectButton.classList.add('is-connected');
                    connectButton.textContent = 'Conectado';
                    addEventLog(`Conectado ao canal ${twitchChannel}.`);
                })
                .catch(error => {
                    console.error(error);
                    twitchConnected = false;
                    updateJoinPrompt();
                    addEventLog(`Falha ao conectar ao canal ${twitchChannel}.`, 'error');
                    document.getElementById('twitch-channel').disabled = false;
                    connectButton.disabled = false;
                    connectButton.classList.remove('is-connecting', 'is-connected');
                    connectButton.classList.add('is-error');
                    connectButton.textContent = 'Tentar novamente';
                });
            document.getElementById('twitch-channel').disabled = true;
            connectButton.disabled = true;
        }

        let players = [];

        function tryToAddPlayer(tags) {
            if (itensSorteados.length > 0) return;

            if (!skinList.length || skinList.length < itemsForEachPlayer) {
                addEventLog('Não foi possível participar: as skins não carregaram corretamente. Atualize a página e tente novamente.', 'error');
                return;
            }

            if (tags.username && !players.find(p => p.username.toLowerCase() == tags.username.toLowerCase())) {
                let idList = [];
                while (idList.length < itemsForEachPlayer) {
                    let newItem = skinList[Math.floor(Math.random() * skinList.length)];
                    if (!idList.includes(newItem.id)) {
                        idList.push(newItem.id);
                    }
                }
                if (idList.length == itemsForEachPlayer) {
                    const listItem = document.createElement('li');
                    listItem.className = 'mb-4 flex justify-between items-center';
                    listItem.dataset.username = tags.username;

                    const itemName = document.createElement('span');
                    itemName.textContent = tags.username;
                    itemName.className = 'font-bold mr-2';

                    const imagesDiv = document.createElement('div');
                    imagesDiv.className = 'flex';
                    let itensDoPlayer = [];
                    for (let i = 0; i < idList.length; i++) {
                        let id = idList[i].trim();
                        if (!itensDoPlayer.includes(id))
                            itensDoPlayer.push(id);
                    }
                    if (itensDoPlayer.length == 6) {
                        itensDoPlayer.forEach(item => {
                            let completeItem = skinList.find(sk => sk.id == item);
                            const img = document.createElement('img');
                            img.src = completeItem.image;
                            img.alt = completeItem.name;
                            img.dataset.id = completeItem.id;
                            img.dataset.player = completeItem.username;
                            img.className = 'item-image mr-1';
                            img.title = completeItem.name;
                            imagesDiv.appendChild(img);
                        });

                        listItem.appendChild(itemName);
                        listItem.appendChild(imagesDiv);
                        listItem.style.borderBottom = '1px solid #ddd';

                        playerList.appendChild(listItem);
                        players.push({ username: tags.username, itens: itensDoPlayer, acertos: 0 });
                        updateJoinPrompt();
                        addEventLog(`${tags.username} entrou no bingo.`, 'player');
                        updateRanking();
                        let adicionarItens = [];
                        itensDoPlayer.forEach(item => adicionarItens.push(skinList.find(it => it.id == item)));
                        adicionarItensParaSeremSorteados(adicionarItens);
                    }
                }
            }
        }

        function adicionarItensParaSeremSorteados(itens) {
            itens.forEach(item => {
                if (!itensSorteaveis.some(it => it == item)) itensSorteaveis.push(item);
            });
        }

        // Função de sorteio
        function sortearItem() {
            if (!twitchConnected) {
                addEventLog('Não é possível sortear: conecte o canal da Twitch antes de começar.', 'error');
                return;
            }

            if (players.length === 0) {
                addEventLog('Ainda não há jogadores inscritos. Peça para o chat enviar !participar e tente novamente.', 'error');
                return;
            }

            if (itensSorteaveis.length > 0) {
                let randomIndex = Math.floor(Math.random() * itensSorteaveis.length);
                let selectedItem;
                do {
                    randomIndex = Math.floor(Math.random() * itensSorteaveis.length);
                    selectedItem = itensSorteaveis[randomIndex];
                }
                while (itensSorteados.some(it => it == selectedItem));
                itensSorteados.push(selectedItem);
                updateJoinPrompt();
                itensSorteaveis = itensSorteaveis.filter(it => it != selectedItem);

                // Verifica quem acertou e atualiza na tela
                let playersQueAcertaram = verificarAcertos(selectedItem);
                let textoPlayersQueAcertaram = "Quem pontuou: ";
                playersQueAcertaram.forEach(p => {
                    textoPlayersQueAcertaram += p + ", ";
                });
                textoPlayersQueAcertaram = textoPlayersQueAcertaram.substring(0, textoPlayersQueAcertaram.length - 2);

                // Cria um novo log para o item sorteado
                const logEntry = document.createElement('div');
                logEntry.innerHTML = `<b>${selectedItem.name}</b><br /> <img src="${selectedItem.image}" class="item-image inline-block"><br /><b>${textoPlayersQueAcertaram}</b>`;
                logEntry.className = 'log-item';

                // Atualiza o log central
                const logCentral = document.getElementById('log-central');
                logCentral.prepend(logEntry);
            }
        }

        function verificarAcertos(selectedItem) {
            let returnList = [];

            players.forEach(player => {
                if (player.itens.find(it => it == selectedItem.id)) {
                    player.acertos++;
                    returnList.push(player.username);
                    let imgsToHighlight = document.querySelectorAll(`img[data-id='${selectedItem.id}']`);
                    imgsToHighlight.forEach(img => img.classList.add('highlight-background'));
                }
            });
            updateRanking();

            if (returnList.length) {
                addEventLog(`${selectedItem.name} marcou ponto para ${returnList.join(', ')}.`, 'score');
            } else {
                addEventLog(`${selectedItem.name} foi sorteada; ninguém pontuou.`, 'score');
            }

            // Procura vencedor (após atualizar ranking, porque mais de um pode vencer ao mesmo tempo)
            players.forEach(player => {
                if (player.acertos == 6 && !winnerList.includes(player.username)) {
                    winnerList.push(player.username);
                    addEventLog(`${player.username} completou as seis skins e venceu!`, 'winner');
                }
            });

            if (winnerList.length) startWinnerWait(winnerList);

            return returnList;
        }

        // Função para atualizar o ranking
        function updateRanking() {
            players.sort((a, b) => b.acertos - a.acertos);
            const rankingContainer = document.getElementById('ranking-container');
            rankingContainer.innerHTML = '<p class="font-bold text-lg mb-4">Ranking dos Jogadores:</p>'; // Limpa o ranking atual
            players.forEach(player => {
                const rankingItem = document.createElement('div');
                rankingItem.className = 'ranking-item';
                rankingItem.textContent = `${player.username} - ${player.acertos} acertos`;
                rankingContainer.appendChild(rankingItem);
            });
        }

        // Função para buscar os dados da API e renderizar a lista de skins
        async function fetchSkins() {
            try {
                const response = await fetch('https://valorant-api.com/v1/weapons/skins?language=pt-BR');
                if (!response.ok) throw new Error(`API respondeu com status ${response.status}`);
                const data = await response.json();
                const skins = data.data;
                if (!Array.isArray(skins)) throw new Error('Resposta da API não contém uma lista de skins.');

                skins.forEach(skin => {
                    // Verifica se o item tem displayIcon e displayName
                    if (skin.displayIcon && skin.displayName && !skin.displayName.endsWith('Padrão') && !skin.displayName.endsWith('aleatória')) {
                        let i = 1;
                        let proposedName;
                        do {
                            proposedName = skin.displayName.substring(0, 3).toUpperCase() + '_' + i.toLocaleString('pt-BR', { minimumIntegerDigits: 3 });
                            i++;
                        } while (skinList.find(sk => sk.id == proposedName));
                        const itemID = proposedName;
                        skinList.push({ id: proposedName, name: skin.displayName, image: skin.displayIcon });
                    }
                });
            } catch (error) {
                console.error('Erro ao buscar as skins:', error);
                addEventLog('Falha ao carregar as skins do Valorant. Atualize a página antes de iniciar a partida.', 'error');
            }
        }

        // Chama a função de busca quando a página carregar
        skinsLoaded = fetchSkins();

        // Adiciona o evento aos botões
        document.getElementById('sortear-btn').addEventListener('click', sortearItem);
        document.getElementById('continue-draw-btn').addEventListener('click', continueDrawForMoreWinners);
        document.getElementById('remove-winner-btn').addEventListener('click', removeAwaitingWinnersAndContinue);
        const helpModal = document.getElementById('help-modal');
        const closeHelp = () => {
            helpModal.hidden = true;
            document.getElementById('help-btn').focus();
        };
        document.getElementById('help-btn').addEventListener('click', () => {
            helpModal.hidden = false;
            document.getElementById('help-close').focus();
        });
        document.getElementById('help-close').addEventListener('click', closeHelp);
        helpModal.addEventListener('click', (event) => {
            if (event.target === helpModal) closeHelp();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !helpModal.hidden) closeHelp();
        });
        // Atualizar o canal da Twitch com o valor inserido no campo de texto
        document.getElementById('set-channel').addEventListener('click', () => {
            const channelInput = document.getElementById('twitch-channel').value;
            if (channelInput) {
                twitchChannel = channelInput;
                console.log("Novo canal da Twitch definido:", twitchChannel);
                initializeTMI(); // Reinicializa o cliente com o novo canal
            }
        });

        // Listener para o checkbox
        document.getElementById('toggle-feature').addEventListener('change', (event) => {
            somenteSubs = event.target.checked;
        });

        playerList.innerHTML = ''; // Limpa a lista antes de renderizar
    </script>
</body>
